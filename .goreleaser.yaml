version: 2

project_name: sheets

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: sheets
    main: ./cmd/sheets
    binary: sheets
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/svlocks/sheets/internal/buildinfo.Version={{.Version}}
        -X github.com/svlocks/sheets/internal/buildinfo.Commit={{.Commit}}
        -X github.com/svlocks/sheets/internal/buildinfo.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

