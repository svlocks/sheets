version: 2

project_name: sheets

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: sheets
    main: ./cmd/sheets
    binary: sheets
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/svlocks/sheets/internal/buildinfo.Version={{.Version}}
        -X github.com/svlocks/sheets/internal/buildinfo.Commit={{.Commit}}
        -X github.com/svlocks/sheets/internal/buildinfo.Date={{.CommitDate}}

archives:
  - formats: [tar.gz]
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644

checksum:
  name_template: checksums.txt

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
